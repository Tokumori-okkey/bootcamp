
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXECUTIVE BOOTCAMP</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap');
:root{--bg:#0a0a0f;--sur:#12121a;--card:#1a1a26;--acc:#f0c040;--red:#e05050;--grn:#40d080;--blu:#6080f0;--txt:#e8e8f0;--dim:#6060a0;--bdr:#2a2a40;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--txt);font-family:"Noto Sans JP",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 14px 60px;}
.logo{font-family:"Bebas Neue",cursive;font-size:1.7rem;letter-spacing:3px;color:var(--acc);text-shadow:0 0 20px rgba(240,192,64,.3);margin-bottom:4px;}
.logo-sub{font-family:"JetBrains Mono",monospace;font-size:.65rem;color:var(--dim);letter-spacing:2px;margin-bottom:18px;}
.app-row{width:100%;max-width:680px;display:flex;gap:10px;margin-bottom:16px;}
.app-btn{flex:1;padding:13px;background:var(--sur);border:2px solid var(--bdr);border-radius:10px;color:var(--dim);font-family:"Bebas Neue",cursive;font-size:1.1rem;letter-spacing:3px;cursor:pointer;transition:all .2s;}
.app-btn.don{background:rgba(64,144,224,.15);border-color:#4090e0;color:#4090e0;}
.app-btn.kin{background:rgba(240,192,64,.15);border-color:var(--acc);color:var(--acc);}
.deck-panel{width:100%;max-width:680px;background:var(--sur);border:1px solid var(--bdr);border-radius:12px;padding:14px 16px;margin-bottom:14px;display:none;}
.deck-title{font-family:"JetBrains Mono",monospace;font-size:.68rem;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin-bottom:10px;}
.deck-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:7px;}
.deck-btn{padding:8px 10px;background:var(--card);border:1px solid var(--bdr);border-radius:7px;color:var(--dim);font-family:"JetBrains Mono",monospace;font-size:.6rem;cursor:pointer;transition:all .18s;text-align:left;line-height:1.4;}
.deck-btn:hover{border-color:var(--acc);color:var(--txt);}
.deck-btn.sel{background:rgba(240,192,64,.12);border-color:var(--acc);color:var(--acc);}
.deck-btn.sel-b{background:rgba(64,144,224,.12);border-color:#4090e0;color:#4090e0;}
.deck-badge{font-size:.55rem;color:var(--dim);display:block;margin-top:2px;}
.sec-label{font-family:"JetBrains Mono",monospace;font-size:.6rem;color:var(--dim);letter-spacing:2px;text-transform:uppercase;padding:6px 0 4px;border-bottom:1px solid var(--bdr);margin:8px 0 6px;grid-column:1/-1;}
.auto-panel{width:100%;max-width:680px;background:var(--sur);border:1px solid var(--bdr);border-radius:12px;padding:13px 16px;margin-bottom:14px;display:none;}
.auto-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.auto-lbl{font-family:"JetBrains Mono",monospace;font-size:.68rem;letter-spacing:2px;color:var(--dim);text-transform:uppercase;}
.tgl{position:relative;width:44px;height:24px;cursor:pointer;display:inline-block;}
.tgl input{opacity:0;width:0;height:0;}
.tgl-track{position:absolute;inset:0;background:var(--bdr);border-radius:24px;transition:background .25s;}
.tgl input:checked+.tgl-track{background:var(--blu);}
.tgl-thumb{position:absolute;top:3px;left:3px;width:18px;height:18px;background:var(--txt);border-radius:50%;transition:transform .25s;pointer-events:none;}
.tgl input:checked~.tgl-thumb{transform:translateX(20px);}
.timer-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.t-item{display:flex;flex-direction:column;gap:5px;}
.t-item label{font-family:"JetBrains Mono",monospace;font-size:.58rem;color:var(--dim);letter-spacing:1px;line-height:1.4;}
.t-row{display:flex;align-items:center;gap:7px;}
.t-row input[type=range]{flex:1;-webkit-appearance:none;height:3px;background:var(--bdr);border-radius:2px;outline:none;cursor:pointer;}
.t-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;background:var(--blu);border-radius:50%;cursor:pointer;}
.t-val{font-family:"Bebas Neue",cursive;font-size:.95rem;color:var(--blu);min-width:28px;text-align:right;}
.auto-status{display:none;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--bdr);}
.auto-status.on{display:flex;}
.a-dot{width:8px;height:8px;border-radius:50%;background:var(--blu);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.2;}}
.a-txt{font-family:"JetBrains Mono",monospace;font-size:.65rem;color:var(--blu);flex:1;}
.cd-wrap{flex:1;height:3px;background:var(--bdr);border-radius:2px;overflow:hidden;}
.cd-bar{height:100%;background:var(--blu);border-radius:2px;transition:width .1s linear;}
.prog-wrap{width:100%;max-width:680px;margin-bottom:14px;display:none;}
.prog-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-family:"JetBrains Mono",monospace;font-size:.72rem;color:var(--dim);}
.prog-num{color:var(--acc);font-size:.95rem;font-weight:700;}
.prog-bar{height:3px;background:var(--bdr);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--red),var(--acc));border-radius:2px;transition:width .4s ease;}
.stats-row{width:100%;max-width:680px;display:none;gap:10px;margin-bottom:14px;}
.stat{flex:1;background:var(--sur);border:1px solid var(--bdr);border-radius:8px;padding:9px;text-align:center;}
.stat .v{font-family:"Bebas Neue",cursive;font-size:1.5rem;line-height:1;}
.stat .l{font-size:.58rem;color:var(--dim);margin-top:2px;font-family:"JetBrains Mono",monospace;letter-spacing:1px;}
.stat.ok .v{color:var(--grn);} .stat.ng .v{color:var(--red);} .stat.rm .v{color:var(--acc);}
.card-wrap{width:100%;max-width:680px;margin-bottom:14px;display:none;}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:38px 32px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;transition:border-color .3s,box-shadow .3s;}
.card::before{content:"";position:absolute;top:-1px;left:-1px;right:-1px;height:3px;background:linear-gradient(90deg,var(--red),var(--acc));border-radius:16px 16px 0 0;}
.card.fc{border-color:var(--grn);box-shadow:0 0 28px rgba(64,208,128,.2);}
.card.fw{border-color:var(--red);box-shadow:0 0 28px rgba(224,80,80,.2);}
.card.sj{border-color:var(--acc);box-shadow:0 0 18px rgba(240,192,64,.15);}
.card.se{border-color:var(--blu);box-shadow:0 0 18px rgba(96,128,240,.18);}
.c-tag{position:absolute;top:12px;right:12px;font-family:"JetBrains Mono",monospace;font-size:.58rem;color:var(--dim);background:var(--bg);padding:2px 6px;border-radius:4px;border:1px solid var(--bdr);}
.c-sub{position:absolute;top:12px;left:12px;font-family:"JetBrains Mono",monospace;font-size:.55rem;color:var(--dim);max-width:60%;}
.spk-j,.spk-e{position:absolute;background:none;border:none;cursor:pointer;font-size:.95rem;opacity:.35;transition:opacity .2s;padding:4px;}
.spk-j:hover,.spk-e:hover{opacity:1;}
.spk-j{bottom:12px;left:12px;} .spk-e{bottom:12px;right:12px;}
.hint-lbl{font-family:"JetBrains Mono",monospace;font-size:.65rem;color:var(--dim);letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;}
.jp{font-size:1.35rem;font-weight:700;text-align:center;line-height:1.65;letter-spacing:.04em;}
.en-wrap{display:none;flex-direction:column;align-items:center;margin-top:16px;padding-top:16px;border-top:1px solid var(--bdr);width:100%;}
.en-wrap.on{display:flex;}
.en{font-family:"JetBrains Mono",monospace;font-size:1.05rem;color:var(--acc);text-align:center;font-weight:700;letter-spacing:.03em;animation:fi .3s ease;}
@keyframes fi{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.btn-rev{width:100%;max-width:680px;padding:14px;background:var(--acc);color:var(--bg);border:none;border-radius:10px;font-family:"Bebas Neue",cursive;font-size:1.2rem;letter-spacing:3px;cursor:pointer;transition:transform .1s,box-shadow .2s;margin-bottom:11px;display:none;}
.btn-rev:hover{box-shadow:0 4px 18px rgba(240,192,64,.4);transform:translateY(-1px);}
.btn-stop{width:100%;max-width:680px;padding:12px;margin-bottom:11px;background:var(--sur);color:var(--blu);border:1px solid var(--blu);border-radius:10px;font-family:"Bebas Neue",cursive;font-size:1.05rem;letter-spacing:3px;cursor:pointer;display:none;transition:transform .1s;}
.btn-stop.on{display:block;}
.judge-row{width:100%;max-width:680px;display:none;gap:10px;}
.judge-row.on{display:flex;}
.btn-ok{flex:1;padding:18px 12px;border:none;border-radius:10px;font-family:"Bebas Neue",cursive;font-size:1.2rem;letter-spacing:2px;cursor:pointer;background:var(--grn);color:var(--bg);transition:transform .1s;}
.btn-ok:hover{box-shadow:0 4px 14px rgba(64,208,128,.4);transform:translateY(-1px);}
.btn-ng{flex:1;padding:18px 12px;border:1px solid var(--red);border-radius:10px;font-family:"Bebas Neue",cursive;font-size:1.2rem;letter-spacing:2px;cursor:pointer;background:var(--sur);color:var(--red);transition:transform .1s;}
.btn-ng:hover{box-shadow:0 4px 14px rgba(224,80,80,.25);transform:translateY(-1px);}
.complete{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:680px;min-height:280px;text-align:center;}
.complete.on{display:flex;}
.c-title{font-family:"Bebas Neue",cursive;font-size:2.6rem;letter-spacing:6px;color:var(--acc);margin-bottom:8px;}
.c-score{font-family:"JetBrains Mono",monospace;font-size:.95rem;color:var(--dim);margin-bottom:6px;}
.c-rate{font-family:"Bebas Neue",cursive;font-size:3.8rem;color:var(--grn);line-height:1;margin-bottom:22px;}
.btn-again{padding:12px 32px;background:var(--acc);color:var(--bg);border:none;border-radius:10px;font-family:"Bebas Neue",cursive;font-size:1.05rem;letter-spacing:3px;cursor:pointer;margin-bottom:10px;transition:transform .1s,box-shadow .2s;}
.btn-again:hover{box-shadow:0 4px 18px rgba(240,192,64,.4);transform:translateY(-1px);}
.btn-retry{padding:10px 26px;background:var(--sur);color:var(--red);border:1px solid var(--red);border-radius:10px;font-family:"Bebas Neue",cursive;font-size:.9rem;letter-spacing:2px;cursor:pointer;}
.btn-retry:disabled{opacity:.3;cursor:not-allowed;}
.welcome{width:100%;max-width:680px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:260px;text-align:center;}
.w-title{font-family:"Bebas Neue",cursive;font-size:2rem;letter-spacing:4px;color:var(--dim);margin-bottom:12px;}
.w-sub{font-family:"JetBrains Mono",monospace;font-size:.7rem;color:var(--dim);line-height:1.8;}
.kbd-row{width:100%;max-width:680px;display:none;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:16px;}
.kbd-row.on{display:flex;}
.ki{display:flex;align-items:center;gap:5px;font-family:"JetBrains Mono",monospace;font-size:.58rem;color:var(--dim);}
kbd{background:var(--sur);border:1px solid var(--bdr);border-radius:4px;padding:2px 5px;font-size:.58rem;}
</style>
</head>
<body>
<div class="logo">EXECUTIVE BOOTCAMP</div>
<div class="logo-sub">FLASHCARD SYSTEM v4.0</div>
<div class="app-row">
  <button class="app-btn" id="btnDon" onclick="selApp('dondondo')">📚 どんどん話す</button>
  <button class="app-btn" id="btnKin" onclick="selApp('kinfure')">⚡ 金フレ</button>
</div>
<div class="deck-panel" id="deckPanel">
  <div class="deck-title" id="deckTitle">デッキを選択</div>
  <div class="deck-grid" id="deckGrid"></div>
</div>
<div class="auto-panel" id="autoPanel">
  <div class="auto-hdr">
    <span class="auto-lbl">🤖 AUTO PLAY + VOICE</span>
    <label class="tgl"><input type="checkbox" id="autoTgl" onchange="toggleAuto()"><div class="tgl-track"></div><div class="tgl-thumb"></div></label>
  </div>
  <div class="timer-grid">
    <div class="t-item"><label>🇯🇵 日本語後<br>→英語まで（秒）</label><div class="t-row"><input type="range" id="dJE" min="1" max="10" step=".5" value="3" oninput="updV('dJE','vJE','s')"><span class="t-val" id="vJE">3s</span></div></div>
    <div class="t-item"><label>🇺🇸 英語後<br>→次まで（秒）</label><div class="t-row"><input type="range" id="dNx" min="1" max="10" step=".5" value="3" oninput="updV('dNx','vNx','s')"><span class="t-val" id="vNx">3s</span></div></div>
    <div class="t-item"><label>🗣️ 英語速度<br>（rate）</label><div class="t-row"><input type="range" id="spRate" min=".6" max="1.4" step=".1" value="1.0" oninput="updV('spRate','vRate','')"><span class="t-val" id="vRate">1.0</span></div></div>
  </div>
  <div class="auto-status" id="autoSt">
    <div class="a-dot"></div><span class="a-txt" id="aTxt">AUTO PLAY 実行中</span>
    <div class="cd-wrap"><div class="cd-bar" id="cdBar" style="width:100%"></div></div>
  </div>
</div>
<div class="prog-wrap" id="progWrap">
  <div class="prog-info"><span>PROGRESS</span><span class="prog-num" id="pNum">1/0</span></div>
  <div class="prog-bar"><div class="prog-fill" id="pFill" style="width:0%"></div></div>
</div>
<div class="stats-row" id="statsRow">
  <div class="stat ok"><div class="v" id="sCor">0</div><div class="l">CORRECT</div></div>
  <div class="stat ng"><div class="v" id="sWrg">0</div><div class="l">RETRY</div></div>
  <div class="stat rm"><div class="v" id="sRem">0</div><div class="l">REMAIN</div></div>
</div>
<div class="card-wrap" id="cardWrap">
  <div class="card" id="mainCard" onclick="reveal()" style="cursor:pointer">
    <div class="c-tag" id="cTag">#1</div>
    <div class="c-sub" id="cSub"></div>
    <button class="spk-j" onclick="event.stopPropagation();spkJ()" title="日本語">🔊</button>
    <div class="hint-lbl">🇯🇵 → 🇺🇸　タップ or Space で答えを見る</div>
    <div class="jp" id="jpTxt"></div>
    <div class="en-wrap" id="enWrap"><div class="en" id="enTxt"></div></div>
    <button class="spk-e" id="spkEBtn" onclick="event.stopPropagation();spkE()" title="英語" style="display:none">🔊</button>
  </div>
</div>
<button class="btn-rev" id="btnRev" onclick="reveal()">▶ 答えを見る（カードをタップ / Space）</button>
<button class="btn-stop" id="btnStop" onclick="stopAuto()">⏹ AUTO PLAY 停止</button>
<div class="judge-row" id="judgeRow">
  <button class="btn-ok" id="btnOk" onclick="judge(true)">✓ 言えた！ (→)</button>
  <button class="btn-ng" id="btnNg" onclick="judge(false)">✗ もう一度 (←)</button>
</div>
<div class="complete" id="complete">
  <div class="c-title">MISSION COMPLETE</div>
  <div class="c-score" id="cScore"></div>
  <div class="c-rate" id="cRate"></div>
  <button class="btn-again" onclick="restartDeck()">▶ もう一度</button>
  <button class="btn-retry" id="btnRetry" onclick="retryWrong()">✗ 間違えたカードのみ再挑戦</button>
</div>
<div class="welcome" id="welcome">
  <div class="w-title">教材を選んでください</div>
  <div class="w-sub">上のボタンから「どんどん話す」または「金フレ」を選択し<br>学習するWeek・範囲を選んでください</div>
</div>
<div class="kbd-row" id="kbdRow">
  <div class="ki"><kbd>Space</kbd> 答えを見る</div>
  <div class="ki"><kbd>→</kbd> 正解</div>
  <div class="ki"><kbd>←</kbd> もう一度</div>
  <div class="ki"><kbd>V</kbd> 日本語読み上げ</div>
  <div class="ki"><kbd>B</kbd> 英語読み上げ</div>
</div>

    {key:'w14',label:'Week 14 / 中3 P4-9',       sub:'中3 Unit 4-9',   cards:c3u(r(4,9)),                    shuf:false},
    {key:'w15',label:'Week 15 / 中3 P10-15',     sub:'中3 Unit 10-15', cards:c3u(r(10,15)),                  shuf:false},
    {key:'w16',label:'Week 16 / 復習 P32-P15',   sub:'中2 U32-34+中3 U1-15', cards:[...c2u(r(32,34)),...c3u(r(1,15))], shuf:false},
    {key:'w17',label:'Week 17 / 中3 P16-22（完）',sub:'中3 Unit 16-22', cards:c3u(r(16,22)),                 shuf:false},
    {key:'w18',label:'Week 18 / ランダム（中1-2）',sub:'中1+中2 全シャッフル', cards:shuf([...C1,...C2]),      shuf:true},
    {key:'w19',label:'Week 19 / ランダム（中3）', sub:'中3 全シャッフル',cards:shuf([...C3]),                 shuf:true},
    {key:'w20',label:'Week 20 / 総復習・卒業',   sub:'中1+2+3 全シャッフル', cards:shuf([...C1,...C2,...C3]), shuf:true},
  ];
  const SHUFFLE=[
    {key:'ws1',label:'Week 1 シャッフル',  sub:'中1 Unit 1-6',   cards:shuf(c1u(r(1,6)))},
    {key:'ws2',label:'Week 2 シャッフル',  sub:'中1 Unit 7-12',  cards:shuf(c1u(r(7,12)))},
    {key:'ws3',label:'Week 3 シャッフル',  sub:'中1 Unit 13-18', cards:shuf(c1u(r(13,18)))},
    {key:'ws6',label:'Week 6 シャッフル',  sub:'中2 Unit 2-7',   cards:shuf(c2u(r(2,7)))},
    {key:'ws7',label:'Week 7 シャッフル',  sub:'中2 Unit 8-13',  cards:shuf(c2u(r(8,13)))},
    {key:'ws9',label:'Week 9 シャッフル',  sub:'中2 Unit 14-19', cards:shuf(c2u(r(14,19)))},
    {key:'ws10',label:'Week 10 シャッフル',sub:'中2 Unit 20-25', cards:shuf(c2u(r(20,25)))},
    {key:'ws11',label:'Week 11 シャッフル',sub:'中2 Unit 26-31', cards:shuf(c2u(r(26,31)))},
    {key:'ws14',label:'Week 14 シャッフル',sub:'中3 Unit 4-9',   cards:shuf(c3u(r(4,9)))},
    {key:'ws15',label:'Week 15 シャッフル',sub:'中3 Unit 10-15', cards:shuf(c3u(r(10,15)))},
    {key:'ws17',label:'Week 17 シャッフル',sub:'中3 Unit 16-22', cards:shuf(c3u(r(16,22)))},
  ];
  return {WEEKS,SHUFFLE};
}

function kinDecks(){
  const res=[];
  const max=Math.max(...KALL.map(c=>c.id));
  for(let s=1;s<=max;s+=100){
    const e=Math.min(s+99,max);
    const cards=KALL.filter(c=>c.id>=s&&c.id<=e);
    if(!cards.length)continue;
    res.push({key:`k${s}`,label:`金フレ ${s}-${e}`,sub:`${cards.length}枚`,cards,shuf:false});
    res.push({key:`ks${s}`,label:`${s}-${e} シャッフル`,sub:`${cards.length}枚`,cards:[...cards].sort(()=>Math.random()-.5),shuf:true});
  }
  res.push({key:'kall',label:'全フレーズ',sub:`${KALL.length}枚`,cards:[...KALL],shuf:false});
  res.push({key:'ksall',label:'全シャッフル',sub:`${KALL.length}枚`,cards:[...KALL].sort(()=>Math.random()-.5),shuf:true});
  return res;
}

// STATE
let curApp=null,curKey=null;
let deck=[],wrong=[],idx=0,okCnt=0,ngCnt=0,revealed=false;
let isAuto=false,aTimer=null,cdTimer=null,cdTotal=0,cdLeft=0;

function selApp(app){
  curApp=app;curKey=null;
  document.getElementById('btnDon').className='app-btn'+(app==='dondondo'?' don':'');
  document.getElementById('btnKin').className='app-btn'+(app==='kinfure'?' kin':'');
  document.getElementById('welcome').style.display='none';
  document.getElementById('deckPanel').style.display='block';
  document.getElementById('deckTitle').textContent=app==='dondondo'?'📚 どんどん話す — Week を選択':'⚡ 金フレ — 範囲を選択';
  document.getElementById('autoPanel').style.display='none';
  document.getElementById('progWrap').style.display='none';
  document.getElementById('statsRow').style.display='none';
  document.getElementById('cardWrap').style.display='none';
  document.getElementById('btnRev').style.display='none';
  document.getElementById('judgeRow').className='judge-row';
  document.getElementById('complete').className='complete';
  document.getElementById('kbdRow').className='kbd-row';
  stopAuto(); renderGrid();
}

function renderGrid(){
  const g=document.getElementById('deckGrid');
  g.innerHTML='';
  if(curApp==='dondondo'){
    const {WEEKS,SHUFFLE}=dondoDecks();
    // スケジュール週
    const lbl1=document.createElement('div'); lbl1.className='sec-label'; lbl1.textContent='📅 スケジュール順'; g.appendChild(lbl1);
    WEEKS.forEach(d=>g.appendChild(mkBtn(d)));
    // シャッフル
    const lbl2=document.createElement('div'); lbl2.className='sec-label'; lbl2.textContent='🔀 週別シャッフル'; g.appendChild(lbl2);
    SHUFFLE.forEach(d=>g.appendChild(mkBtn(d)));
  } else {
    kinDecks().forEach(d=>g.appendChild(mkBtn(d)));
  }
}
function mkBtn(d){
  const b=document.createElement('button');
  const sel=d.key===curKey;
  b.className='deck-btn'+(sel?(curApp==='dondondo'?' sel-b':' sel'):'');
  b.innerHTML=(d.shuf?'🔀 ':'')+d.label+`<span class="deck-badge">${d.sub} / ${d.cards.length}枚</span>`;
  b.onclick=()=>startDeck(d); return b;
}

function startDeck(d){
  curKey=d.key;
  if(curApp==='dondondo'){
    deck=d.cards.map(c=>(({ja:c.ja,en:c.en,sub:`${c.title}`,tag:`U${c.num}`,cardId:null})));
  }else{
    deck=d.cards.map(c=>(({ja:c.ja,en:c.en,sub:'',tag:`#${c.id}`,cardId:c.id})));
  }
  wrong=[];idx=0;okCnt=0;ngCnt=0;revealed=false;
  clearCD();stopAllAudio();clearTimeout(aTimer);
  isAuto=false;document.getElementById('autoTgl').checked=false;
  document.getElementById('autoPanel').style.display='block';
  document.getElementById('progWrap').style.display='block';
  document.getElementById('statsRow').style.display='flex';
  document.getElementById('cardWrap').style.display='block';
  document.getElementById('btnRev').style.display='block';
  document.getElementById('btnStop').className='btn-stop';
  document.getElementById('judgeRow').className='judge-row';
  document.getElementById('complete').className='complete';
  document.getElementById('kbdRow').className='kbd-row on';
  renderGrid(); renderCard();
}

function renderCard(){
  if(idx>=deck.length){showComplete();return;}
  revealed=false;
  const c=deck[idx];
  document.getElementById('jpTxt').textContent=c.ja;
  document.getElementById('enTxt').textContent=c.en;
  document.getElementById('cTag').textContent=c.tag;
  document.getElementById('cSub').textContent=c.sub;
  document.getElementById('enWrap').className='en-wrap';
  document.getElementById('spkEBtn').style.display='none';
  document.getElementById('mainCard').className='card';
  document.getElementById('mainCard').style.cursor='pointer';
  document.getElementById('btnRev').style.display=isAuto?'none':'block';
  document.getElementById('judgeRow').className='judge-row';
  updStats();
}
function reveal(){
  if(revealed||isAuto)return;
  revealed=true;
  document.getElementById('enWrap').className='en-wrap on';
  document.getElementById('spkEBtn').style.display='block';
  document.getElementById('btnRev').style.display='none';
  document.getElementById('judgeRow').className='judge-row on';
  document.getElementById('mainCard').style.cursor='default';
  spkE();
}
function judge(ok){
  if(!revealed||isAuto)return;
  const el=document.getElementById('mainCard');
  if(ok){okCnt++;el.classList.add('fc');}
  else{ngCnt++;wrong.push(deck[idx]);el.classList.add('fw');}
  idx++; setTimeout(renderCard,280);
}
function updStats(){
  const t=deck.length,d=idx;
  document.getElementById('pNum').textContent=Math.min(d+1,t)+'/'+t;
  document.getElementById('pFill').style.width=(d/t*100)+'%';
  document.getElementById('sCor').textContent=okCnt;
  document.getElementById('sWrg').textContent=ngCnt;
  document.getElementById('sRem').textContent=t-d;
}
function showComplete(){
  window.speechSynthesis.cancel();clearTimeout(aTimer);clearCD();
  isAuto=false;document.getElementById('autoTgl').checked=false;
  document.getElementById('btnStop').className='btn-stop';
  const t=deck.length,rate=Math.round(okCnt/t*100);
  document.getElementById('cardWrap').style.display='none';
  document.getElementById('btnRev').style.display='none';
  document.getElementById('judgeRow').className='judge-row';
  document.getElementById('cScore').textContent=`正解 ${okCnt} / ${t}`;
  document.getElementById('cRate').textContent=rate+'%';
  document.getElementById('complete').className='complete on';
  document.getElementById('btnRetry').disabled=!wrong.length;
}
function restartDeck(){
  if(!curKey)return;
  let d=null;
  if(curApp==='dondondo'){
    const {WEEKS,SHUFFLE}=dondoDecks();
    d=[...WEEKS,...SHUFFLE].find(x=>x.key===curKey);
  }else{d=kinDecks().find(x=>x.key===curKey);}
  if(d)startDeck(d);
}
function retryWrong(){
  if(!wrong.length)return;
  deck=[...wrong];wrong=[];idx=0;okCnt=0;ngCnt=0;revealed=false;
  document.getElementById('complete').className='complete';
  document.getElementById('cardWrap').style.display='block';
  document.getElementById('btnRev').style.display='block';
  document.getElementById('judgeRow').className='judge-row';
  renderCard();
}

// VOICE
const SY=window.speechSynthesis;
let vJ=null,vE=null;
function loadV(){const v=SY.getVoices();vJ=v.find(x=>x.lang==='ja-JP')||v.find(x=>x.lang.startsWith('ja'));vE=v.find(x=>x.lang==='en-US')||v.find(x=>x.lang==='en-GB')||v.find(x=>x.lang.startsWith('en'));}
loadV();if(SY.onvoiceschanged!==undefined)SY.onvoiceschanged=loadV;
function spk(t,l,r,cb){SY.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=l;u.rate=r||1;if(l==='ja-JP'&&vJ)u.voice=vJ;if(l==='en-US'&&vE)u.voice=vE;if(cb)u.onend=cb;SY.speak(u);}
function stopAllAudio(){SY.cancel();}
function spkJ(){const c=deck[idx];if(!c)return;document.getElementById('mainCard').classList.add('sj');spk(c.ja,'ja-JP',1,()=>document.getElementById('mainCard').classList.remove('sj'));}
function spkE(){const c=deck[idx];if(!c)return;const r=parseFloat(document.getElementById('spRate').value);document.getElementById('mainCard').classList.add('se');spk(c.en,'en-US',r,()=>document.getElementById('mainCard').classList.remove('se'));}

// TIMER
function updV(id,vid,sfx){const v=parseFloat(document.getElementById(id).value);document.getElementById(vid).textContent=sfx?v+sfx:v.toFixed(1);}
function startCD(ms,lbl){cdTotal=ms;cdLeft=ms;document.getElementById('aTxt').textContent=lbl;document.getElementById('autoSt').className='auto-status on';clearInterval(cdTimer);cdTimer=setInterval(()=>{cdLeft-=100;document.getElementById('cdBar').style.width=Math.max(0,cdLeft/cdTotal*100)+'%';if(cdLeft<=0)clearInterval(cdTimer);},100);}
function clearCD(){clearInterval(cdTimer);document.getElementById('cdBar').style.width='100%';document.getElementById('autoSt').className='auto-status';}

// AUTO PLAY
function toggleAuto(){
  isAuto=document.getElementById('autoTgl').checked;
  if(isAuto){document.getElementById('btnRev').style.display='none';document.getElementById('btnStop').className='btn-stop on';document.getElementById('judgeRow').className='judge-row';runAuto();}
  else stopAuto();
}
function stopAuto(){isAuto=false;document.getElementById('autoTgl').checked=false;clearTimeout(aTimer);clearCD();SY.cancel();document.getElementById('btnStop').className='btn-stop';document.getElementById('autoSt').className='auto-status';if(deck.length&&idx<deck.length){if(!revealed)document.getElementById('btnRev').style.display='block';else{document.getElementById('judgeRow').className='judge-row on';}}}
function runAuto(){
  if(!isAuto)return;
  if(idx>=deck.length){showComplete();return;}
  const c=deck[idx];
  const dJE=parseFloat(document.getElementById('dJE').value)*1000;
  const dNx=parseFloat(document.getElementById('dNx').value)*1000;
  const r=parseFloat(document.getElementById('spRate').value);
  document.getElementById('mainCard').classList.add('sj');
  startCD(2500,'🇯🇵 日本語読み上げ中...');
  spk(c.ja,'ja-JP',1,()=>{
    document.getElementById('mainCard').classList.remove('sj');
    if(!isAuto)return;
    startCD(dJE,`⏳ ${document.getElementById('dJE').value}秒後に英語表示...`);
    aTimer=setTimeout(()=>{
      if(!isAuto)return;
      revealed=true;
      document.getElementById('enWrap').className='en-wrap on';
      document.getElementById('spkEBtn').style.display='block';
      document.getElementById('mainCard').classList.add('se');
      startCD(3000,'🇺🇸 英語読み上げ中...');
      spk(c.en,'en-US',r,()=>{
        document.getElementById('mainCard').classList.remove('se');
        if(!isAuto)return;
        startCD(dNx,`⏭ ${document.getElementById('dNx').value}秒後に次へ...`);
        aTimer=setTimeout(()=>{if(!isAuto)return;idx++;updStats();renderCard();runAuto();},dNx);
      });
    },dJE);
  });
}

// KEYBOARD
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.code==='Space'){e.preventDefault();reveal();}
  else if(e.code==='ArrowRight')judge(true);
  else if(e.code==='ArrowLeft')judge(false);
  else if(e.code==='KeyV')spkJ();
  else if(e.code==='KeyB')spkE();
});
</script>
